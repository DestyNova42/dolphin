name: Build Windows (mode manette)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Visual Studio
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -format text | Select-String "displayName|installationVersion"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure
        run: >
          cmake --preset ninja-release-x64 -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          -DBP_BUILD_ID=${{ github.sha }}

      - name: Build
        run: cmake --build --preset ninja-build-release-x64 --target dolphin-emu -- -k 0

      - name: sccache stats
        run: sccache --show-stats

      - name: Package
        shell: pwsh
        run: |
          $src = "build/release/x64/Binaries"
          Get-ChildItem $src | Format-Table Name, Length
          New-Item -ItemType Directory -Force dist/Dolphin-Manette | Out-Null
          robocopy $src dist/Dolphin-Manette /E /XF *.pdb *.ilk *.lib *.exp /NFL /NDL
          if ($LASTEXITCODE -ge 8) { exit 1 } else { exit 0 }

      - uses: actions/upload-artifact@v4
        with:
          name: Dolphin-Manette-Windows
          path: dist/Dolphin-Manette

      - name: Publish release (updates of the controller mode)
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/Dolphin-Manette/* -DestinationPath Dolphin-Manette-Windows.zip -Force
          gh release delete manette-latest --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create manette-latest Dolphin-Manette-Windows.zip `
            --target "${{ github.sha }}" --title "${{ github.sha }}" --latest `
            --notes "Dolphin mode manette - build ${{ github.sha }}"
